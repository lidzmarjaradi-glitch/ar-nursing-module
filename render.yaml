services:
  - type: web
    name: ar-nursing-module
    runtime: node
    plan: free
    buildCommand: npm install && node scripts/download_heart.js
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      # Set SKETCHFAB_TOKEN manually in the Render dashboard (Environment tab).
      # Required to download the heart model at build time.
      - key: SKETCHFAB_TOKEN
        sync: false
